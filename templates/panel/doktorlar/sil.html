<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doktor Sil — Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: #f8faff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .modal {
            background: white; border-radius: 20px; padding: 40px;
            max-width: 480px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.12); text-align: center;
        }
        .warning-icon { font-size: 56px; margin-bottom: 16px; }
        h2 { font-size: 22px; font-weight: 600; color: #111827; margin-bottom: 8px; }
        p { font-size: 14px; color: #6b7280; margin-bottom: 8px; line-height: 1.6; }
        .doktor-name { font-weight: 600; color: #111827; font-size: 16px; margin: 16px 0; padding: 12px; background: #f3f4f6; border-radius: 10px; }
        .btn-row { display: flex; gap: 12px; margin-top: 24px; }
        .btn-cancel {
            flex: 1; padding: 12px; border: 1.5px solid #e5e7eb; border-radius: 10px;
            font-size: 14px; font-weight: 500; color: #6b7280; background: white;
            cursor: pointer; text-decoration: none; font-family: 'DM Sans', sans-serif;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .btn-cancel:hover { border-color: #9ca3af; color: #111827; }
        .btn-delete {
            flex: 1; padding: 12px; background: #dc2626; color: white; border: none;
            border-radius: 10px; font-size: 14px; font-weight: 600;
            font-family: 'DM Sans', sans-serif; cursor: pointer; transition: background 0.2s;
        }
        .btn-delete:hover { background: #b91c1c; }
    </style>
</head>
<body>
<div class="modal">
    <div class="warning-icon">⚠️</div>
    <h2>Doktoru Sil</h2>
    <p>Bu doktoru silmek istediğinize emin misiniz?</p>
    <div class="doktor-name">👨‍⚕️ {{ doktor.name }}</div>
    <p style="font-size:12px;color:#dc2626;">Bu işlem geri alınamaz.</p>
    <div class="btn-row">
        <a href="{{ PANEL_URL }}/{{ clinic_id }}/doktorlar/" class="btn-cancel">İptal</a>
        <form method="post" style="flex:1">
            {% csrf_token %}
            <button type="submit" class="btn-delete" style="width:100%">Evet, Sil</button>
        </form>
    </div>
</div>
</body>
</html>
