<style>
.zil-btn {
    position: relative; background: #f3f4f6; border: none;
    border-radius: 10px; width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer; transition: background 0.2s;
    text-decoration: none;
}
.zil-btn:hover { background: #e5e7eb; }
#bildirim-badge {
    position: absolute; top: -5px; right: -5px;
    background: #dc2626; color: white;
    border-radius: 999px; font-size: 10px; font-weight: 700;
    min-width: 18px; height: 18px;
    display: none; align-items: center; justify-content: center;
    padding: 0 4px; border: 2px solid white;
    font-family: 'DM Sans', sans-serif;
}
</style>

<a href="{{ PANEL_URL }}/{{ clinic_id }}/bildirimler/" class="zil-btn" title="Bildirimler">
    🔔
    <span id="bildirim-badge"></span>
</a>
