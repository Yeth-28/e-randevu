            <input type="text" maxlength="1" inputmode="numeric" class="ayarlar-otp-box" style="width:48px;height:56px;text-align:center;font-size:22px;font-weight:700;border-radius:12px;border:2px solid #e5e7eb;background:#fafafa;font-family:monospace;outline:none;transition:all 0.2s;">
            <input type="text" maxlength="1" inputmode="numeric" class="ayarlar-otp-box" style="width:48px;height:56px;text-align:center;font-size:22px;font-weight:700;border-radius:12px;border:2px solid #e5e7eb;background:#fafafa;font-family:monospace;outline:none;transition:all 0.2s;">

<style>
.bildirim-popup{background:white;border-radius:14px;padding:14px 16px;box-shadow:0 8px 32px rgba(0,0,0,0.18);border-left:4px solid #2563eb;display:flex;align-items:flex-start;gap:10px;animation:bSlideIn 0.35s cubic-bezier(0.34,1.56,0.64,1);pointer-events:all;margin-bottom:8px;}
.bildirim-popup.iptal_randevu{border-left-color:#dc2626;}
.bildirim-popup.yeni_randevu{border-left-color:#16a34a;}
.bp-icon{font-size:20px;flex-shrink:0;}
.bp-title{font-size:13px;font-weight:600;color:#111827;margin-bottom:2px;}
.bp-body{font-size:12px;color:#6b7280;}
.bp-kapat{margin-left:auto;background:none;border:none;font-size:18px;color:#6b7280;cursor:pointer;padding:0 0 0 8px;flex-shrink:0;line-height:1;}
@keyframes bSlideIn{from{transform:translateX(130%);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes bSlideOut{from{transform:translateX(0);opacity:1;}to{transform:translateX(130%);opacity:0;}}
</style>

<script>
// ─── ACCORDION & DOĞRULAMA ──────────────────────────────────
var _CID = "{{ clinic_id }}";
if (!_CID) _CID = "{{ clinic.clinic_id }}";

var _ayarlarDogrulandı = (function(){
    try {
        var exp = parseInt(localStorage.getItem('ayarlar_exp_' + _CID) || '0');
        return Date.now() < exp;
    } catch(e){ return false; }
})();
var _ayarlarHatirla = false;

// Sayfa yüklenince aktif sayfadaysa accordion açık başlat (doğrulama bypass)
(function(){
    var path = window.location.pathname;
    var aktifSayfalar = ['/doktorlar', '/abonelik', '/raporlar', '/ayarlar'];
    var aktif = aktifSayfalar.some(function(p){ return path.indexOf(p) > -1; });
    if (aktif) {
        // Aktif sayfadaysak doğrulamayı bypass et, accordion açık göster
        document.addEventListener('DOMContentLoaded', function(){
            document.getElementById('ayarlar-baslik').classList.add('acik');
            document.getElementById('ayarlar-alt').classList.add('acik');
        });
    }
})();

function ayarlarTikla() {
    var baslik = document.getElementById('ayarlar-baslik');
    var alt    = document.getElementById('ayarlar-alt');
    if (baslik.classList.contains('acik')) {
        baslik.classList.remove('acik');
        alt.classList.remove('acik');
        return;
    }
    if (_ayarlarDogrulandı) {
        _ayarlarAc();
        return;
    }
    // Modal'ı önce aç, arka planda kod gönder
    _modalAc();
    ayarlarKodGonder();
}

function _ayarlarAc() {
    document.getElementById('ayarlar-baslik').classList.add('acik');
    document.getElementById('ayarlar-alt').classList.add('acik');
}

function ayarlarKodGonder() {
    var base = window.location.protocol + '//' + window.location.host;
    fetch(base + '/' + _CID + '/klinik-ayarlar-kod-gonder/', {
        method: 'POST',
        headers: {'X-CSRFToken': _getCsrf(), 'Content-Type': 'application/json'},
        credentials: 'include'
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
        if (d.email) document.getElementById('ayarlar-modal-email').textContent = d.email + ' adresine kod gönderildi.';
    })
    .catch(function(e){ console.log('Kod gönderilemedi:', e); });
}

function _modalAc() {
    var m = document.getElementById('ayarlar-modal');
    m.style.display = 'flex';
    document.getElementById('ayarlar-modal-error').style.display = 'none';
    document.querySelectorAll('.ayarlar-otp-box').forEach(function(b){
        b.value = ''; b.style.borderColor = '#e5e7eb'; b.style.background = '#fafafa';
    });
    setTimeout(function(){ var f = document.querySelector('.ayarlar-otp-box'); if(f) f.focus(); }, 100);
}

function ayarlarModalKapat() {
    document.getElementById('ayarlar-modal').style.display = 'none';
}

function toggleAyarlarHatirla() {
    _ayarlarHatirla = !_ayarlarHatirla;
    document.getElementById('ayarlar-hatirla-toggle').style.background = _ayarlarHatirla ? '#2563eb' : '#e5e7eb';
    document.getElementById('ayarlar-hatirla-dot').style.transform = _ayarlarHatirla ? 'translateX(16px)' : 'translateX(0)';
}

function ayarlarDogrula() {
    var otp = Array.from(document.querySelectorAll('.ayarlar-otp-box')).map(function(b){ return b.value; }).join('');
    if (otp.length < 6) {
        _modalHata('6 haneli kodu eksiksiz girin.');
        return;
    }
    var btn = document.getElementById('ayarlar-dogrula-btn');
    btn.disabled = true; btn.textContent = '⏳ Kontrol ediliyor...';
    var base = window.location.protocol + '//' + window.location.host;
    fetch(base + '/' + _CID + '/klinik-ayarlar-dogrula/', {
        method: 'POST',
        headers: {'X-CSRFToken': _getCsrf(), 'Content-Type': 'application/json'},
        credentials: 'include',
        body: JSON.stringify({otp: otp, hatirla: _ayarlarHatirla})
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
        btn.disabled = false; btn.textContent = '✓ Doğrula';
        if (d.success) {
            _ayarlarDogrulandı = true;
            var sure = _ayarlarHatirla ? 30*24*60*60*1000 : 60*60*1000;
            try { localStorage.setItem('ayarlar_exp_' + _CID, String(Date.now() + sure)); } catch(e){}
            ayarlarModalKapat();
            _ayarlarAc();
        } else {
            _modalHata(d.message || '❌ Kod hatalı veya süresi dolmuş.');
            document.querySelectorAll('.ayarlar-otp-box').forEach(function(b){ b.style.borderColor = '#dc2626'; });
        }
    })
    .catch(function(){
        btn.disabled = false; btn.textContent = '✓ Doğrula';
        _modalHata('Bağlantı hatası, tekrar deneyin.');
    });
}

function _modalHata(msg) {
    var el = document.getElementById('ayarlar-modal-error');
    el.style.display = 'block'; el.textContent = msg;
}

function _getCsrf() {
    var parts = ('; ' + document.cookie).split('; csrftoken=');
    return parts.length === 2 ? parts.pop().split(';').shift() : '';
}

// OTP kutucuk navigasyonu
document.addEventListener('DOMContentLoaded', function(){
    var boxes = document.querySelectorAll('.ayarlar-otp-box');
    boxes.forEach(function(box, i){
        box.addEventListener('input', function(){
            box.value = box.value.replace(/\D/g,'').slice(-1);
            box.style.borderColor = box.value ? '#2563eb' : '#e5e7eb';
            box.style.background  = box.value ? '#eff6ff' : '#fafafa';
            if (box.value && i < boxes.length - 1) boxes[i+1].focus();
        });
        box.addEventListener('keydown', function(e){
            if (e.key === 'Backspace' && !box.value && i > 0) {
                boxes[i-1].focus(); boxes[i-1].value = '';
                boxes[i-1].style.borderColor = '#e5e7eb'; boxes[i-1].style.background = '#fafafa';
            }
            if (e.key === 'Enter') ayarlarDogrula();
        });
        box.addEventListener('paste', function(e){
            e.preventDefault();
            var p = (e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'');
            boxes.forEach(function(inp,j){
                inp.value = p[j] || '';
                inp.style.borderColor = inp.value ? '#2563eb' : '#e5e7eb';
                inp.style.background  = inp.value ? '#eff6ff' : '#fafafa';
            });
            boxes[Math.min(p.length, boxes.length-1)].focus();
        });
    });
});

// ─── BİLDİRİM SİSTEMİ ──────────────────────────────────────
(function(){
    var CLINIC_ID = _CID;
    if (!CLINIC_ID) return;
    var BASE       = window.location.protocol + '//' + window.location.host;
    var API_URL    = BASE + '/' + CLINIC_ID + '/api/bildirimler/';
    var OKUNDU_URL = BASE + '/' + CLINIC_ID + '/api/bildirimler/okundu/';
    var gosterilmisIds = new Set();
    try { gosterilmisIds = new Set(JSON.parse(localStorage.getItem('pb_'+CLINIC_ID)||'[]')); } catch(e){}
    var audioCtx = null;
    function getCtx(){
        if(!audioCtx){ try{ audioCtx=new(window.AudioContext||window.webkitAudioContext)(); }catch(e){return null;} }
        if(audioCtx.state==='suspended') audioCtx.resume();
        return audioCtx;
    }
    document.addEventListener('click', function(){ getCtx(); }, {once:true});
    function sesOynat(type){
        var ctx = getCtx();
        if(!ctx || ctx.state!=='running') return;
        try{
            var now=ctx.currentTime;
            var notlar = type==='yeni_randevu' ? [[880,0],[660,0.18]] : [[440,0],[330,0.2]];
            notlar.forEach(function(n){
                var osc=ctx.createOscillator(), gain=ctx.createGain();
                osc.type='sine'; osc.frequency.value=n[0];
                gain.gain.setValueAtTime(0.22,now+n[1]);
                gain.gain.exponentialRampToValueAtTime(0.001,now+n[1]+0.45);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(now+n[1]); osc.stop(now+n[1]+0.5);
            });
        }catch(e){}
    }
    function popupGoster(b){
        var c = document.getElementById('bildirim-container');
        if(!c) return;
        var icon = b.type==='yeni_randevu' ? '📅' : b.type==='iptal_randevu' ? '❌' : '🔔';
        var el = document.createElement('div');
        el.className = 'bildirim-popup ' + (b.type||'');
        el.innerHTML = '<div class="bp-icon">'+icon+'</div>'
            +'<div style="flex:1;"><div class="bp-title">'+b.title+'</div>'
            +'<div class="bp-body">'+b.body+'</div>'
            +'<div style="font-size:11px;color:#9ca3af;margin-top:3px;">'+b.created_at+'</div></div>'
            +'<button class="bp-kapat" onclick="this.closest(\'.bildirim-popup\').remove()">✕</button>';
        c.appendChild(el);
        setTimeout(function(){
            el.style.animation='bSlideOut 0.3s ease forwards';
            setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 300);
        }, 7000);
    }
    function badgeGuncelle(n){
        var b = document.getElementById('sidebar-bildirim-badge');
        if(!b) return;
        b.textContent = n>99 ? '99+' : String(n);
        b.style.display = n>0 ? 'inline-block' : 'none';
    }
    function getCookie(name){
        var parts = ('; '+document.cookie).split('; '+name+'=');
        return parts.length===2 ? parts.pop().split(';').shift() : '';
    }
    function okunduIsaretle(ids){
        if(!ids.length) return;
        fetch(OKUNDU_URL, {
            method:'POST',
            headers:{'Content-Type':'application/json','X-CSRFToken':getCookie('csrftoken')},
            body:JSON.stringify({ids:ids}),
            credentials:'include'
        }).catch(function(){});
    }
    window.bildirimKontrol = function(){
        fetch(API_URL, {credentials:'include'})
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(data){
            if(!data) return;
            var bildirimler = data.notifications || [];
            var yeniler = bildirimler.filter(function(b){ return !gosterilmisIds.has(b.id); });
            badgeGuncelle(bildirimler.length);
            yeniler.forEach(function(b){
                gosterilmisIds.add(b.id);
                sesOynat(b.type);
                popupGoster(b);
            });
            try{ localStorage.setItem('pb_'+CLINIC_ID, JSON.stringify(Array.from(gosterilmisIds).slice(-200))); }catch(e){}
            if(yeniler.length) okunduIsaretle(yeniler.map(function(b){ return b.id; }));
        })
        .catch(function(){});
    };
    bildirimKontrol();
    setInterval(bildirimKontrol, 15000);
})();
</script>
