<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap — DentalReserv</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --blue: #2563eb;
            --blue-dark: #1d4ed8;
            --bg: #f0f4ff;
            --white: #ffffff;
            --gray: #6b7280;
            --gray-light: #e5e7eb;
            --text: #111827;
            --error: #dc2626;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 50%, #dbeafe 0%, transparent 50%),
                              radial-gradient(circle at 80% 20%, #e0e7ff 0%, transparent 40%);
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 900px;
            min-height: 520px;
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(37, 99, 235, 0.12);
            overflow: hidden;
        }

        /* SOL PANEL */
        .left-panel {
            flex: 1;
            background: linear-gradient(145deg, #1e40af, #3b82f6);
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .left-panel::before {
            content: '';
            position: absolute;
            width: 300px; height: 300px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            top: -80px; right: -80px;
        }

        .left-panel::after {
            content: '';
            position: absolute;
            width: 200px; height: 200px;
            border-radius: 50%;
            background: rgba(255,255,255,0.07);
            bottom: -40px; left: -40px;
        }

        .brand { position: relative; z-index: 1; }
        .brand-icon { font-size: 36px; margin-bottom: 8px; }
        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .brand-tagline {
            font-size: 13px;
            opacity: 0.75;
            margin-top: 4px;
            font-weight: 300;
        }

        .features { position: relative; z-index: 1; }
        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            opacity: 0.9;
        }
        .feature-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
            flex-shrink: 0;
        }

        /* SAĞ PANEL */
        .right-panel {
            flex: 1;
            padding: 48px 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--text);
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--gray);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--gray-light);
            border-radius: 10px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fafafa;
            outline: none;
        }

        input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            background: white;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        .btn-login:hover { background: var(--blue-dark); transform: translateY(-1px); }
        .btn-login:active { transform: translateY(0); }

        .error-list {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--error);
        }

        .footer-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--gray);
        }

        .footer-link a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 500;
        }

        @media (max-width: 640px) {
            .left-panel { display: none; }
            .right-panel { padding: 32px 24px; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- SOL PANEL -->
    <div class="left-panel">
        <div class="brand">
            <div class="brand-icon">🦷</div>
            <div class="brand-name">DentalReserv</div>
            <div class="brand-tagline">Diş Kliniği Yönetim Sistemi</div>
        </div>
        <div class="features">
            <div class="feature-item">
                <div class="feature-dot"></div>
                <span>Multi-klinik yönetimi</span>
            </div>
            <div class="feature-item">
                <div class="feature-dot"></div>
                <span>3D diş haritası</span>
            </div>
            <div class="feature-item">
                <div class="feature-dot"></div>
                <span>Randevu & hasta takibi</span>
            </div>
            <div class="feature-item">
                <div class="feature-dot"></div>
                <span>Doktor & rol yönetimi</span>
            </div>
        </div>
    </div>

    <!-- SAĞ PANEL -->
    <div class="right-panel">
        <h2>Tekrar hoş geldin</h2>
        <p class="subtitle">Hesabınıza giriş yapın</p>

        {% if form.errors %}
        <div class="error-list">
            E-posta veya şifre hatalı. Lütfen tekrar deneyin.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">E-posta</label>
                <input type="text" name="username" id="id_username" placeholder="ornek@klinik.com" autofocus>
            </div>
            <div class="form-group">
                <label for="id_password">Şifre</label>
                <input type="password" name="password" id="id_password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login">Giriş Yap →</button>
        </form>

        <div class="footer-link">
            <a href="/">← Ana Sayfaya Dön</a>
        </div>
    </div>

</div>
</body>
</html>
