<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Süper Admin Girişi</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #1e293b; border-radius: 20px; padding: 40px; width: 400px; border: 1px solid #334155; }
        .logo { text-align: center; margin-bottom: 28px; }
        .logo .icon { font-size: 40px; }
        .logo h1 { font-size: 20px; color: white; margin-top: 8px; }
        .logo p { font-size: 13px; color: #64748b; margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
        .form-group input {
            width: 100%; padding: 11px 14px; background: #0f172a; border: 1.5px solid #334155;
            border-radius: 10px; font-size: 14px; color: white; font-family: 'DM Sans', sans-serif; outline: none;
        }
        .form-group input:focus { border-color: #2563eb; }
        .btn { width: 100%; padding: 13px; background: #2563eb; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; margin-top: 8px; }
        .btn:hover { background: #1d4ed8; }
        .error { background: #450a0a; color: #fca5a5; padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; border: 1px solid #7f1d1d; }
        .warning { background: #1c1917; border: 1px solid #44403c; border-radius: 10px; padding: 12px 16px; font-size: 12px; color: #78716c; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="icon">🔐</div>
            <h1>Süper Admin</h1>
            <p>Sadece yetkili erişim</p>
        </div>
        {% if error %}
        <div class="error">⚠️ {{ error }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>E-posta</label>
                <input type="email" name="email" required autofocus>
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn">Giriş Yap</button>
        </form>
        <div class="warning">🔒 Bu panel yalnızca yerel ağdan erişilebilir</div>
    </div>
</body>
</html>
