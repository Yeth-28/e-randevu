<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klinik Bulunamadı — e-Randevu</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'DM Sans',sans-serif;background:#f9fafb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
        .card{background:white;border-radius:24px;padding:48px 40px;width:100%;max-width:480px;text-align:center;box-shadow:0 16px 60px rgba(0,0,0,0.08);}
        .icon{width:80px;height:80px;background:linear-gradient(135deg,#f59e0b,#f97316);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 24px;}
        h1{font-size:24px;font-weight:700;color:#111827;margin-bottom:8px;}
        .sub{font-size:15px;color:#6b7280;margin-bottom:28px;line-height:1.5;}
        .btn{display:block;padding:13px;border-radius:12px;font-size:14px;font-weight:600;text-decoration:none;text-align:center;margin-bottom:10px;transition:all 0.2s;}
        .btn-primary{background:#2563eb;color:white;}
        .btn-primary:hover{background:#1d4ed8;}
    </style>
</head>
<body>
<div class="card">
    <div class="icon">🔍</div>
    <h1>Bu Klinik Bulunamadı</h1>
    <div class="sub">
        Aradığınız klinik pasif olabilir ya da adres hatalı yazılmış olabilir.
        Tüm klinikleri e-Randevu ana sayfasından arayabilirsiniz.
    </div>
    <a href="{{ SITE_URL }}/" class="btn btn-primary">← e-Randevu Ana Sayfaya Dön</a>
</div>
</body>
</html>
