{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Hasta Girişi — e-Randevu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
<div class="auth-card">
    <div class="auth-logo">
        <span class="auth-logo-icon">🦷</span>
        <div class="auth-logo-text">e-<span>Randevu</span></div>
        <div class="auth-subtitle">Hasta Portalı</div>
    </div>

    <h1 class="auth-title">Giriş Yap</h1>
    <p class="auth-desc">Hesabınıza erişin</p>

    {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-error" role="alert">{{ msg }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST" novalidate>
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label" for="email">E-posta</label>
            <input type="email" name="email" id="email" class="form-input"
                   placeholder="ornek@mail.com" required autofocus
                   autocomplete="email">
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Şifre</label>
            <div class="pass-wrap">
                <input type="password" name="password" id="password" class="form-input"
                       placeholder="••••••••" required autocomplete="current-password">
                <button type="button" class="eye-btn" onclick="togglePass()" aria-label="Şifreyi göster/gizle">
                    <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>
        <button type="submit" class="btn-primary">Giriş Yap →</button>
    </form>

    <div class="divider">veya</div>

    <a href="{{ SITE_URL }}/hasta/kayit/" class="btn-outline">Yeni Hesap Oluştur</a>

    <div class="auth-hint" style="margin-top:16px;">
        Kliniğiniz için mi? <a href="{{ PANEL_URL }}/giris/">Panel Girişi →</a>
    </div>
</div>

<div class="auth-back">
    <a href="{{ SITE_URL }}/">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Ana Sayfaya Dön
    </a>
</div>

<script>
const eyeSvg = {
    open: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
    closed: '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
};
let passVisible = false;
function togglePass(){
    const inp = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    passVisible = !passVisible;
    inp.type = passVisible ? 'text' : 'password';
    icon.innerHTML = passVisible ? eyeSvg.closed : eyeSvg.open;
}
</script>
</body>
</html>
